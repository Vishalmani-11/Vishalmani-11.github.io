<script>
// create() comes from main.js - do not redeclare it here

let allWriteups = [];
let currentIndex = -1;

async function initWriteupPage() {
  await window.loadAllData();
  allWriteups = window.writeupsData || [];
  const urlParams = new URLSearchParams(window.location.search);
  const slug = urlParams.get('slug');
  
  if (!slug) {
    document.getElementById('writeup-content').replaceChildren(
      create('div', { class: 'error-message' }, 'No writeup specified. Please provide a slug.')
    );
    return;
  }
  
  const writeup = allWriteups.find(w => w.slug === slug);
  if (!writeup) {
    document.getElementById('writeup-content').replaceChildren(
      create('div', { class: 'error-message' }, 'Writeup not found.')
    );
    return;
  }
  
  currentIndex = allWriteups.findIndex(w => w.slug === slug);
  await loadAndRenderWriteup(writeup, slug);
}

async function loadAndRenderWriteup(writeup, slug) {
  const localUrl = `writeups/${slug}.md`;
  const externalBase = 'https://raw.githubusercontent.com/Vishalmani-11/HTB-Writeups/main/';
  const externalUrl = writeup?.source ? `${externalBase}${writeup.source.replace(/\\/g, '/')}` : null;

  try {
    let markdown = null;
    const localResponse = await fetch(localUrl);
    if (localResponse.ok) {
      markdown = await localResponse.text();
    }

    if (!markdown && externalUrl) {
      const externalResponse = await fetch(externalUrl);
      if (!externalResponse.ok) throw new Error('External source not found');
      markdown = await externalResponse.text();
    }

    if (!markdown) throw new Error('Writeup file not found');
    renderWriteup(writeup, markdown);
  } catch (error) {
    console.error('Error loading writeup:', error);
    document.getElementById('writeup-content').replaceChildren(
      create('div', { class: 'error-message' }, 'Failed to load writeup content.')
    );
  }
}

function parseFrontMatter(markdown) {
  const match = markdown.match(/^---\s*\n(.*?)\n---/s);
  if (!match) return { frontMatter: {}, body: markdown };
  const frontMatter = {};
  const lines = match[1].split('\n');
  lines.forEach(line => {
    const colonIndex = line.indexOf(':');
    if (colonIndex > 0) {
      const key = line.substring(0, colonIndex).trim();
      const value = line.substring(colonIndex + 1).trim();
      frontMatter[key] = value;
    }
  });
  let body = markdown.substring(match[0].length).trim();
  body = body.replace(/^#\s+.*\n/, '');
  return { frontMatter, body };
}

function calculateReadingTime(text) {
  const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
  const minutes = Math.max(1, Math.ceil(words / 200));
  return `${minutes} min read`;
}

function renderWriteup(writeup, markdown) {
  const { frontMatter, body } = parseFrontMatter(markdown);
  const dateEl = document.getElementById('writeup-date');
  const categoryEl = document.getElementById('writeup-category');
  const platformEl = document.getElementById('writeup-platform');
  const difficultyEl = document.getElementById('writeup-difficulty');
  const titleEl = document.getElementById('writeup-title');
  const readingTimeEl = document.getElementById('writeup-reading-time');
  
  if (dateEl) {
    const date = new Date(frontMatter.date || writeup.date || '');
    dateEl.textContent = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }
  
  if (categoryEl && (frontMatter.category || writeup.category)) {
    categoryEl.textContent = `Category: ${frontMatter.category || writeup.category}`;
  }
  
  if (platformEl && (frontMatter.platform || writeup.platform)) {
    platformEl.textContent = `Platform: ${frontMatter.platform || writeup.platform}`;
  }
  
  if (difficultyEl) {
    const difficulty = parseInt(frontMatter.difficulty || writeup.difficulty || 1);
    difficultyEl.replaceChildren(difficultyBars(difficulty));
  }
  
  const resolvedTitle = (frontMatter.title || writeup?.title || 'Untitled').trim();
  if (titleEl) {
    titleEl.textContent = resolvedTitle;
  }
  document.title = `${resolvedTitle} | Vishal M Portfolio`;
  
  if (readingTimeEl) {
    readingTimeEl.textContent = calculateReadingTime(body);
  }
  
  const content = document.getElementById('writeup-content');
  if (content) {
    marked.setOptions({ breaks: true, gfm: true });
    const html = marked.parse(body);
    const cleanHtml = DOMPurify.sanitize(html, { ALLOWED_TAGS: ['p','br','b','i','em','strong','a','code','pre','ul','ol','li','h1','h2','h3','h4','h5','h6','blockquote','img','hr','table','thead','tbody','tr','th','td','span','div','details','summary'] });
    content.innerHTML = cleanHtml;
    setTimeout(() => {
      document.querySelectorAll('pre code').forEach(el => {
        const pre = el.parentElement;
        if (pre && pre.tagName === 'PRE') {
          const btn = create('button', { class: 'copy-btn' }, 'Copy');
          btn.onclick = () => {
            navigator.clipboard.writeText(el.textContent);
            btn.classList.add('copied');
            setTimeout(() => btn.classList.remove('copied'), 2000);
          };
          pre.appendChild(btn);
        }
      });
      document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    }, 100);
  }
  updateWriteupNav();
}

function updateWriteupNav() {
  const prevBtn = document.getElementById('prev-writeup');
  const nextBtn = document.getElementById('next-writeup');
  if (prevBtn) {
    if (currentIndex > 0) {
      const prev = allWriteups[currentIndex - 1];
      prevBtn.href = `writeup.html?slug=${prev.slug}`;
      prevBtn.style.opacity = '1';
      prevBtn.style.cursor = 'pointer';
    } else {
      prevBtn.href = '#';
      prevBtn.style.opacity = '0.5';
      prevBtn.style.cursor = 'not-allowed';
    }
  }
  if (nextBtn) {
    if (currentIndex < allWriteups.length - 1) {
      const next = allWriteups[currentIndex + 1];
      nextBtn.href = `writeup.html?slug=${next.slug}`;
      nextBtn.style.opacity = '1';
      nextBtn.style.cursor = 'pointer';
    } else {
      nextBtn.href = '#';
      nextBtn.style.opacity = '0.5';
      nextBtn.style.cursor = 'not-allowed';
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initWriteupPage);
} else {
  initWriteupPage();
}
</script>
