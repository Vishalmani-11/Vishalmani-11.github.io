<script>
// create() and difficultyBars() come from main.js - do not redeclare them here

// Projects page specific logic
let allProjects = [];
let filteredProjects = [];
let currentSort = 'default';
let currentLanguage = '';
let currentTag = '';

async function initProjectsPage() {
  await window.loadAllData();
  allProjects = [...(window.projectsData || []), ...(window.githubData?.repos || [])];
  
  // Deduplicate by repo name
  const seen = new Map();
  allProjects.forEach(p => {
    const key = p.repo || p.name;
    if (key && !seen.has(key)) {
      seen.set(key, p);
    }
  });
  allProjects = Array.from(seen.values());
  
  renderProjectsFilters();
  filterAndSortProjects();
  
  // Set up event listeners
  document.getElementById('project-search')?.addEventListener('input', e => {
    filterAndSortProjects();
  });
}

function setSort(sort) {
  currentSort = sort;
  document.querySelectorAll('[data-sort]').forEach(el => {
    el.classList.toggle('active', el.dataset.sort === sort);
  });
  filterAndSortProjects();
}

function setLanguage(lang) {
  currentLanguage = lang;
  document.querySelectorAll('#language-filters .filter-chip').forEach(el => {
    el.classList.toggle('active', el.textContent.includes(lang) || (lang === '' && el.textContent === 'All languages'));
  });
  filterAndSortProjects();
}

function setTag(tag) {
  currentTag = tag;
  document.querySelectorAll('#tag-filters .filter-chip').forEach(el => {
    el.classList.toggle('active', el.textContent.includes(tag) || (tag === '' && el.textContent === 'All tags'));
  });
  filterAndSortProjects();
}

function renderProjectsFilters() {
  const langFilters = document.getElementById('language-filters');
  const tagFilters = document.getElementById('tag-filters');
  
  if (langFilters) {
    const languages = [...new Set(allProjects.map(p => p.language).filter(Boolean))];
    langFilters.replaceChildren(
      create('span', { class: 'filter-chip active', onclick: 'setLanguage("")' }, 'All languages'),
      ...languages.map(lang => create('span', { class: 'filter-chip', onclick: `setLanguage('${lang}')` }, lang))
    );
  }
  
  if (tagFilters) {
    const tags = [...new Set(allProjects.flatMap(p => p.tags || p.topics || []).filter(Boolean))];
    tagFilters.replaceChildren(
      create('span', { class: 'filter-chip active', onclick: 'setTag("")' }, 'All tags'),
      ...tags.map(tag => create('span', { class: 'filter-chip', onclick: `setTag('${tag}')` }, tag))
    );
  }
}

function filterAndSortProjects() {
  const searchTerm = document.getElementById('project-search')?.value.toLowerCase() || '';
  
  filteredProjects = allProjects.filter(p => {
    const name = (p.repo || p.name || '').toLowerCase();
    const title = (p.title || '').toLowerCase();
    const summary = (p.summary || p.description || '').toLowerCase();
    const tags = (p.tags || p.topics || []).join(' ').toLowerCase();
    const language = (p.language || '').toLowerCase();
    
    const matchesSearch = !searchTerm || name.includes(searchTerm) || title.includes(searchTerm) || summary.includes(searchTerm) || tags.includes(searchTerm);
    const matchesLanguage = !currentLanguage || language === currentLanguage || (p.languages && p.languages[currentLanguage]);
    const matchesTag = !currentTag || tags.includes(currentTag);
    
    return matchesSearch && matchesLanguage && matchesTag;
  });
  
  sortProjects();
  renderProjectRows();
}

function sortProjects() {
  switch (currentSort) {
    case 'updated':
      filteredProjects.sort((a, b) => new Date(b.pushed_at || 0) - new Date(a.pushed_at || 0));
      break;
    case 'stars':
      filteredProjects.sort((a, b) => (b.stargazers_count || 0) - (a.stargazers_count || 0));
      break;
    default:
      // Featured first, then by pushed_at
      filteredProjects.sort((a, b) => {
        if (a.featured && !b.featured) return -1;
        if (!a.featured && b.featured) return 1;
        return new Date(b.pushed_at || 0) - new Date(a.pushed_at || 0);
      });
  }
}

function renderProjectRows() {
  const container = document.getElementById('all-projects');
  if (!container) return;

  if (filteredProjects.length === 0) {
    container.replaceChildren(create('div', { class: 'empty-state' }, [
      create('h3', {}, 'No projects found'),
      create('p', {}, 'Try adjusting your filters')
    ]));
    return;
  }

  container.replaceChildren(...filteredProjects.map(p => {
    const name = p.repo || p.name;
    const ghData = window.githubData?.repos?.find(r => r.name === name);
    const merged = { ...p, ...ghData };
    const date = merged.pushed_at
      ? new Date(merged.pushed_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
      : 'Updating soon';
    const title = merged.title || name || 'Untitled';

    return create('a', {
      class: 'row',
      href: repoReadmeUrl(name) || '#',
      target: '_blank',
      rel: 'noopener noreferrer'
    }, [
      create('span', { class: 'd' }, date),
      create('div', {}, [
        create('b', {}, title),
        create('small', {}, merged.summary || merged.description || '')
      ]),
      create('span', { class: 'c' }, merged.language || (merged.tags || [])[0] || 'Project'),
      difficultyBars(merged.difficulty || 1)
    ]);
  }));
}

// Initialize when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initProjectsPage);
} else {
  initProjectsPage();
}
</script>
